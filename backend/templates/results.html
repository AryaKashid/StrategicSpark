<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Results | AdaptLearn</title>
    <link rel="stylesheet" href="/static/css/quiz.css">
    <style>
        .results-screen {
            display: block !important;
            opacity: 1;
        }

        .quiz-container {
            margin-top: 10vh;
            margin-bottom: 10vh;
        }
    </style>
</head>

<body>
    <div id="vanta-bg"></div>

    <div class="quiz-container">
        <!-- Results State -->
        <div id="results-screen" class="results-screen">
            <h1 class="results-title">Quiz Complete!</h1>

            <div class="summary-box">
                <h3>Expert Remark</h3>
                <p id="top-remark-content">Great effort on the quiz!</p>
            </div>

            <!-- Metrics Row -->
            <div class="metrics-container">
                <div class="metric-card">
                    <div class="metric-circle" id="accuracy-circle">
                        <span id="accuracy-value">0%</span>
                    </div>
                    <p>Accuracy</p>
                </div>
                <div class="metric-card">
                    <div class="metric-circle" id="mastery-circle">
                        <span id="mastery-value">0%</span>
                    </div>
                    <p>Topic Mastery</p>
                </div>
            </div>

            <div class="ai-summary" id="ai-summary-text">
                <h3>Expert Feedback</h3>
                <p id="bottom-summary-content">Analyzing your performance...</p>
                <button id="toggle-review-btn" class="btn-outline hidden" style="margin-top: 1rem;">View Details &
                    Mistakes →</button>
            </div>

            <!-- Concept Weaver Bridge Lesson (Moved out for immediate visibility) -->
            <div id="concept-weaver-container">
                <div class="bridge-lesson-card">
                    <div class="bridge-header">
                        <span class="spark-icon">⚡</span>
                        <h3>Concept Weaver: Foundational Bridge</h3>
                    </div>
                    <div class="bridge-content">
                        <h4 id="foundational-gap-title">Foundational Gap: ...</h4>
                        <p id="bridge-lesson-text">...</p>

                        <div class="bridge-actions">
                            <button id="voice-lesson-btn" class="bridge-btn voice">
                                <span class="btn-icon">🔊</span> Listen to Mentor
                            </button>
                            <button id="video-lesson-btn" class="bridge-btn video">
                                <span class="btn-icon">📺</span> Watch Concept
                            </button>
                        </div>

                        <p class="why-it-matters" style="margin-top: 1.5rem;"><strong>Why it matters:</strong> <span
                                id="why-it-matters-text">...</span></p>
                    </div>
                </div>
            </div>

            <!-- Recommendations Section -->
            <div id="recommendations-section">
                <h3 class="section-title">Personalized Learning Path</h3>
                <div id="course-recommendations" class="courses-grid"></div>
            </div>

            <!-- Detailed Review Section (Now Toggleable) -->
            <div id="review-section" class="hidden">

                <h3 class="section-title">Review Key Concepts</h3>
                <div id="wrong-answers-container" class="review-grid"></div>
            </div>

            <div class="results-actions">
                <button onclick="window.location.href='/dashboard'" class="btn-next">Return to Dashboard</button>
                <button id="retake-btn" class="btn-outline">Retake Quiz</button>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/vanta@latest/dist/vanta.net.min.js"></script>
    <script src="/static/js/results.js"></script>
</body>

</html>
