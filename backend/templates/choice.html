<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Choose Your Path | AdaptLearn</title>
    <style>
        :root {
            --primary: #6366f1;
            --secondary: #a855f7;
            --bg: #0a192f;
            --text: #ffffff;
            --glass: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        #vanta-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
        }

        .header {
            text-align: center;
            margin-bottom: 3rem;
            z-index: 1;
        }

        .header h1 {
            font-size: 3rem;
            font-weight: 800;
            background: linear-gradient(to right, #818cf8, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 1rem;
        }

        .header p {
            font-size: 1.1rem;
            color: rgba(255, 255, 255, 0.7);
        }

        .choice-container {
            display: flex;
            gap: 2rem;
            max-width: 1000px;
            width: 90%;
            z-index: 1;
        }

        .choice-card {
            flex: 1;
            background: var(--glass);
            backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 3rem 2rem;
            text-align: center;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            text-decoration: none;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1.5rem;
        }

        .choice-card:hover {
            transform: translateY(-10px);
            background: rgba(255, 255, 255, 0.08);
            border-color: var(--primary);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4), 0 0 20px rgba(99, 102, 241, 0.2);
        }

        .icon-box {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
            margin-bottom: 1rem;
            box-shadow: 0 10px 20px rgba(99, 102, 241, 0.3);
        }

        .choice-card h2 {
            font-size: 1.8rem;
            font-weight: 700;
        }

        .choice-card p {
            color: rgba(255, 255, 255, 0.6);
            line-height: 1.6;
        }

        .btn {
            margin-top: 1rem;
            padding: 0.8rem 2rem;
            background: white;
            color: var(--bg);
            border-radius: 12px;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .choice-card:hover .btn {
            background: var(--primary);
            color: white;
        }

        @media (max-width: 768px) {
            .choice-container {
                flex-direction: column;
            }
            .header h1 {
                font-size: 2.2rem;
            }
        }
    </style>
</head>
<body>
    <div id="vanta-bg"></div>

    <div class="header">
        <h1>Welcome to AdaptLearn!</h1>
        <p>What would you like to focus on today?</p>
    </div>

    <div class="choice-container">
        <a href="/levels" class="choice-card">
            <div class="icon-box">📚</div>
            <h2>I want to Learn</h2>
            <p>Explore curated courses from Udemy, Coursera, and more to master new skills.</p>
            <div class="btn">Start Learning</div>
        </a>

        <a href="/dashboard" class="choice-card">
            <div class="icon-box">🎯</div>
            <h2>I want to give Quiz</h2>
            <p>Challenge yourself with domain-specific quizzes and test your knowledge level.</p>
            <div class="btn">Take a Quiz</div>
        </a>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/vanta@latest/dist/vanta.net.min.js"></script>
    <script>
        VANTA.NET({
            el: "#vanta-bg",
            mouseControls: true,
            touchControls: true,
            gyroControls: false,
            minHeight: 200.00,
            minWidth: 200.00,
            scale: 1.00,
            scaleMobile: 1.00,
            color: 0x6366f1,
            backgroundColor: 0x0a192f,
            points: 12.00,
            maxDistance: 20.00,
            spacing: 16.00
        });
    </script>
</body>
</html>
