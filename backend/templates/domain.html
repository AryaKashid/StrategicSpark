<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ domain.title }} | FuturePath AI</title>
    <link rel="stylesheet" href="/static/css/domain.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div id="vanta-canvas"></div>
    <nav class="navbar">
        <div class="logo"><strong>NEXUS</strong></div>
        <div class="project-title">{{ domain.title }} Learning Paths</div>
        <div class="back-btn" onclick="window.location.href='/dashboard'">
            <span>← Back</span>
        </div>
    </nav>
    <div class="hero">
        <h2>{{ domain.icon }} Explore {{ domain.title }} Topics</h2>
        <p class="description">{{ domain.description }}</p>
    </div>
    <div class="container">
        <div class="topics-grid">
            {% for topic in domain.topics %}
            <div class="topic-card">
                <i class="topic-icon">{{ topic.icon }}</i>
                <h3>{{ topic.name }}</h3>
                <p>{{ topic.desc }}</p>
                <button class="learn-btn" onclick="startLearning('{{ topic.name }}')">Start Learning</button>
            </div>
            {% endfor %}
        </div>
    </div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/vanta@latest/dist/vanta.net.min.js"></script>
    <script src="/static/js/domain.js"></script>
</body>
</html>
