<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Intelligent Quiz | AdaptLearn</title>
    <link rel="stylesheet" href="/static/css/quiz.css">
</head>
<body>
    <div id="vanta-bg"></div>

    <div class="quiz-container">
        <!-- Loading State -->
        <div id="loading-overlay">
            <div class="spinner"></div>
            <p id="loading-text">Gemini is curating your questions...</p>
        </div>

        <!-- Quiz State -->
        <div id="quiz-content" class="hidden">
            <div class="progress-bar">
                <div id="progress-fill"></div>
            </div>
            
            <div class="question-box">
            <div class="question-header" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;">
                <p id="question-meta" style="color: var(--secondary); font-weight: 600; margin: 0;"></p>
                <button class="voice-btn" onclick="speakQuestion()">🔊 Listen</button>
            </div>
            <h2 id="question-text">Loading question...</h2>
                <div class="options-grid" id="options-container"></div>
            </div>

            <div class="controls">
                <span id="question-count">Question 1 of 5</span>
                <button id="next-btn" class="btn-next" disabled>Next Question</button>
            </div>
        </div>

        <!-- Results State -->
        <div id="results-screen" class="results-screen">
            <h1 class="results-title">Quiz Complete!</h1>
            
            <!-- Metrics Row -->
            <div class="metrics-container">
                <div class="metric-card">
                    <div class="metric-circle" id="accuracy-circle">
                        <span id="accuracy-value">0%</span>
                    </div>
                    <p>Accuracy</p>
                </div>
                <div class="metric-card">
                    <div class="metric-circle" id="precision-circle">
                        <span id="precision-value">0%</span>
                    </div>
                    <p>Precision</p>
                </div>
            </div>

            <div class="ai-summary" id="ai-summary-text">
                <h3>Expert Feedback</h3>
                <p id="summary-content">Analyzing your performance...</p>
            </div>

            <!-- Detailed Review Section -->
            <div id="review-section" class="hidden">
                <h3 class="section-title">Review Key Concepts</h3>
                <div id="wrong-answers-container" class="review-grid"></div>
            </div>

            <!-- Recommendations Section -->
            <div id="recommendations-section" class="hidden">
                <h3 class="section-title">Personalized Learning Path</h3>
                <div id="course-recommendations" class="courses-grid"></div>
            </div>
            
            <div class="results-actions">
                <button onclick="window.location.href='/dashboard'" class="btn-next">Return to Dashboard</button>
                <button onclick="window.location.reload()" class="btn-outline">Retake Quiz</button>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/vanta@latest/dist/vanta.net.min.js"></script>
    <script src="/static/js/quiz.js"></script>
</body>
</html>
