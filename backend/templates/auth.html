<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Authentication | AI Learning Sys</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Outfit', sans-serif;
        }

        body {
            /* Vanta will attach here */
            background-color: #0a192f;
            color: #fff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        /* Glassmorphism Container */
        .auth-container {
            width: 100%;
            max-width: 450px;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            position: relative;
            z-index: 10;
            transition: transform 0.3s ease;
        }

        .auth-container:hover {
            transform: translateY(-5px);
            box-shadow: 0 30px 60px -12px rgba(99, 102, 241, 0.4);
        }

        h2 {
            text-align: center;
            margin-bottom: 30px;
            font-weight: 600;
            font-size: 2rem;
            letter-spacing: 1px;
            color: #e2e8f0;
        }

        .form-group {
            position: relative;
            margin-bottom: 25px;
        }

        .form-group input {
            width: 100%;
            padding: 15px 20px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            color: #fff;
            font-size: 1rem;
            outline: none;
            transition: all 0.3s ease;
        }

        .form-group input:focus {
            background: rgba(255, 255, 255, 0.12);
            border-color: #6366f1;
            box-shadow: 0 0 15px rgba(99, 102, 241, 0.3);
        }

        .form-group label {
            position: absolute;
            top: 50%;
            left: 20px;
            transform: translateY(-50%);
            color: #94a3b8;
            pointer-events: none;
            transition: 0.3s ease;
            font-size: 1rem;
        }

        .form-group input:focus~label,
        .form-group input:valid~label {
            top: -10px;
            left: 15px;
            font-size: 0.8rem;
            color: #6366f1;
            background: #0a192f;
            padding: 0 5px;
            border-radius: 4px;
        }

        .btn {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, #6366f1 0%, #3b82f6 100%);
            color: #fff;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.4);
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(99, 102, 241, 0.6);
        }

        .switch-form {
            text-align: center;
            margin-top: 25px;
            font-size: 0.95rem;
            color: #cbd5e1;
        }

        .switch-form span {
            color: #60a5fa;
            cursor: pointer;
            font-weight: 600;
            transition: color 0.3s ease;
        }

        .switch-form span:hover {
            color: #93c5fd;
            text-decoration: underline;
        }

        .hidden {
            display: none;
        }

        #message {
            margin-top: 15px;
            text-align: center;
            font-size: 0.9rem;
            min-height: 20px;
        }

        .success {
            color: #4ade80;
        }

        .error {
            color: #f87171;
        }
    </style>
</head>

<body>

    <div class="auth-container">
        <!-- Login Form -->
        <form id="loginForm">
            <h2>Welcome Back</h2>
            <div class="form-group">
                <input type="email" id="loginEmail" required>
                <label>Email Address</label>
            </div>
            <div class="form-group">
                <input type="password" id="loginPassword" required>
                <label>Password</label>
            </div>
            <button type="submit" class="btn">Sign In</button>
            <div class="switch-form">
                New here? <span onclick="toggleForms()">Create an account</span>
            </div>
        </form>

        <!-- Registration Form -->
        <form id="registerForm" class="hidden">
            <h2>Create Account</h2>
            <div class="form-group">
                <input type="text" id="regName" required>
                <label>Full Name</label>
            </div>
            <div class="form-group">
                <input type="email" id="regEmail" required>
                <label>Email Address</label>
            </div>
            <div class="form-group">
                <input type="password" id="regPassword" required>
                <label>Password</label>
            </div>
            <button type="submit" class="btn">Sign Up</button>
            <div class="switch-form">
                Already have an account? <span onclick="toggleForms()">Sign In</span>
            </div>
        </form>

        <div id="message"></div>
    </div>

    <!-- Vanta.js Dependencies -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/vanta@latest/dist/vanta.net.min.js"></script>

    <script>
        // Initialize Vanta Background as requested
        window.addEventListener('DOMContentLoaded', () => {
            VANTA.NET({
                el: "body",
                mouseControls: true,
                touchControls: true,
                gyroControls: false,
                minHeight: 200.00,
                minWidth: 200.00,
                scale: 1.00,
                scaleMobile: 1.00,
                color: 0x3f51b5,           /* The dots and lines (Indigo Blue) */
                backgroundColor: 0x0a192f, /* Dark Navy Blue Background */
                points: 10.00,             /* Amount of dots */
                maxDistance: 20.00,        /* Line connection distance */
                spacing: 15.00             /* Density of the net */
            });
        });

        const API_BASE = "http://127.0.0.1:5000/api";
        const loginForm = document.getElementById("loginForm");
        const registerForm = document.getElementById("registerForm");
        const messageDiv = document.getElementById("message");

        function toggleForms() {
            loginForm.classList.toggle("hidden");
            registerForm.classList.toggle("hidden");
            messageDiv.textContent = "";
        }

        function showMessage(text, isError = false) {
            messageDiv.textContent = text;
            messageDiv.className = isError ? 'error' : 'success';
        }

        // Handle Login
        loginForm.addEventListener("submit", async (e) => {
            e.preventDefault();
            const email = document.getElementById("loginEmail").value;
            const password = document.getElementById("loginPassword").value;

            try {
                const res = await fetch(`${API_BASE}/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });

                const data = await res.json();

                if (res.ok) {
                    showMessage("Login Successful! Redirecting...");
                    localStorage.setItem("authToken", data.token);
                    localStorage.setItem("authUser", JSON.stringify(data.user));
                    setTimeout(() => {
                        window.location.href = "/dashboard";
                    }, 1000);
                } else {
                    showMessage(data.message || "Login failed", true);
                }
            } catch (err) {
                showMessage("Connection error. Is backend running?", true);
            }
        });

        // Handle Registration
        registerForm.addEventListener("submit", async (e) => {
            e.preventDefault();
            const name = document.getElementById("regName").value;
            const email = document.getElementById("regEmail").value;
            const password = document.getElementById("regPassword").value;

            try {
                const res = await fetch(`${API_BASE}/register`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, email, password })
                });

                const data = await res.json();

                if (res.ok) {
                    showMessage("Registration successful! Please sign in.");
                    setTimeout(() => toggleForms(), 1500);
                } else {
                    showMessage(data.message || "Registration failed", true);
                }
            } catch (err) {
                showMessage("Connection error. Is backend running?", true);
            }
        });
    </script>
</body>

</html>
